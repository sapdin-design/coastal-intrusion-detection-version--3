version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cidrtm_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cidrtm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cidrtm_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cidrtm
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=cidrtm_production_secret_kanyakumari_2026
    depends_on:
      - mongodb
    networks:
      - cidrtm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cidrtm_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cidrtm_network

volumes:
  mongo_data:

networks:
  cidrtm_network:
    driver: bridge
